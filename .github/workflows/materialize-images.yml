name: Materialize appeal images
on:
  push:
    paths:
      - "src-b64/**"
      - ".github/workflows/materialize-images.yml"
  workflow_dispatch:
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode images into appeal-2026-11
        run: |
          set -euo pipefail
          mkdir -p appeal-2026-11
          for f in src-b64/*.b64; do
            name="$(basename "$f" .b64)"
            base64 -d "$f" > "appeal-2026-11/${name}"
            echo "decoded $name ($(wc -c < "appeal-2026-11/${name}") bytes)"
          done
      - name: Commit decoded images
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appeal-2026-11
          if git diff --cached --quiet; then
            echo "No image changes to commit"
            exit 0
          fi
          git commit -m "Add decoded cropped landscape photos for Nov 2026 JAS appeal"
          git push
